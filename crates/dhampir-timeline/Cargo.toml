[package]
name = "dhampir-timeline"
description = "dhampir 的时间线纯数据模型：整数帧号、有理数时间基、时间码换算与 serde 契约。零 GPU 依赖。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, optional = true }
schemars = { version = "1", optional = true }

[features]
default = ["serde"]
# `Timebase` 要能直接进出时间线 JSON（指导文档 §5.2 的 `"timebase": {"num":…,"den":…}`），
# 所以 serde 是默认开的；但关掉它这个 crate 依然完整可用（零依赖）。
serde = ["dep:serde"]
# JSON Schema 只给代码生成用，所以是可选的：
# 依赖 timeline 的 crate（core / wasm / worker）不需要为一份 .d.ts 把 schemars 也编进去。
json-schema = ["dep:schemars", "serde"]

# 例程：把 schema v1 导成 JSON Schema（TS 类型的上游）。
# 需要 --features json-schema，所以显式声明，免得 cargo 默认去编它。
[[example]]
name = "emit_schema"
required-features = ["json-schema"]

[dev-dependencies]
# 契约层的核心承诺是「能序列化成 JSON、且同一份数据序列化逐字节稳定」，
# 所以测试必须真的解析一遍，不能只靠类型定义看着像对。
# dev-dependency 不会传播给依赖 timeline 的 crate（core 不受影响）。
serde_json = { workspace = true }
