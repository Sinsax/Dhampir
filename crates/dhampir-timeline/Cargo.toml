[package]
name = "dhampir-timeline"
description = "dhampir 的时间线纯数据模型：整数帧号、有理数时间基、时间码换算与 serde 契约。零 GPU 依赖。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
# `Timebase` 要能直接进出时间线 JSON（指导文档 §5.2 的 `"timebase": {"num":…,"den":…}`），
# 所以 serde 是默认开的；但关掉它这个 crate 依然完整可用（零依赖）。
serde = ["dep:serde"]
