# dhampir-framediff 的阈值档 —— **同机同栈**那一腿的严格档：判"逐字节相等"。
#
# 什么时候用这一份：
#   两侧跑在**同一台机器、同一个 GPU、同一个驱动**上（例：浏览器 WebGPU/NVIDIA vs
#   native DX12/NVIDIA）。这种情况下两份帧本来就是同一段 WGSL、同一个驱动算出来的，
#   差一个字节都不是"容差"、是**真缺陷**——所以这里不给任何余量。
#
# 为什么这份是全档而不是只写 max_abs_diff_max = 0：
#   · `max_abs_diff_max = 0` 是这份档真正承重的那一条：RGBA 四通道最大值都是 0，
#     等于逐字节相等；它也是唯一不可能被"两处同样的错正好抵消"蒙过去的一条。
#   · 两条 SSIM 底线写成 1 不是为了再加一道保险，而是**工具本来就这么要求**：
#     `mean_ssim_min` / `min_ssim_min` 是必须解析出来的两条（没设闸的场景不许混进全过），
#     所以哪怕只想要 maxdiff 那条，也得把这两条写全。
#   · 这里不写 `psnr_db_min`：逐字节相等时 PSNR 是无穷，任何有限底线都恒过，
#     写个数（比如 100）只会让读记录的人以为 100 是个有来历的门槛。
#     想用 PSNR 拦东西的情况，去 framediff-thresholds.toml 那份里按实测定档。
#
# 反过来说：这份档跑绿只证明"这两条腿算出来一样"，
# 不证明"算得对"——对错由 corpus 的采样点判据（run.json 的 points）负责。
#
# 与 plan §5 风险表那句"容差必须设，**禁止要求 1.0**"的关系（别当成打架）：
#   那句话管的是**跨 GPU 的浮点不确定性**。这份档恰恰不是跨 GPU——
#   同一块卡、同一个驱动、同一段 WGSL，实测出来就是逐字节相等（M2 T2.4 真跑）。
#   跨厂商那一腿走 framediff-thresholds.toml，那份里一个 1.0 都没有，
#   而且 `max_abs_diff_max` 也**故意空着**，等 T2.6 实测再定档。

[default]
mean_ssim_min = 1
min_ssim_min = 1
max_abs_diff_max = 0
