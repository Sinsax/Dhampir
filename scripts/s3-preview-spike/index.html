<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>M3 预览链路 · 实测</title>
<style>body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 12px; } video { width: 320px; } canvas { width: 320px; border: 1px solid #ccc; } #log { white-space: pre-wrap; }</style>
</head>
<body>
<h1>M3 预览链路实测：Rust 侧 FrameSource（拷贝路线）与 JS 参考逐字节比</h1>
<video id="v" src="/media/proxy.mp4" muted playsinline preload="auto"></video>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="log"></pre>
<script type="module">
const NL = String.fromCharCode(10);
const logEl = document.getElementById('log');
const log = (m) => { logEl.textContent += m + NL; };
const post = (o) => fetch('/result', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(o) });
const report = {};
const step = (name) => { report.step = name; };

// 与 Rust 侧同参数的 FNV-1a 64（16 位小写十六进制）——摘要能跨语言直接比。
function fnv1a64(bytes) {
  let h = 0xcbf29ce484222325n;
  const prime = 0x100000001b3n;
  const mask = (1n << 64n) - 1n;
  for (let i = 0; i < bytes.length; i += 1) { h = ((h ^ BigInt(bytes[i])) * prime) & mask; }
  return h.toString(16).padStart(16, '0');
}

// JS 参考实现：自己走一遍「拷贝 + textureLoad 搬运」，与 Rust 侧比摘要。
const WGSL = [
  '@group(0) @binding(0) var t: texture_2d<f32>;',
  '@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {',
  '  var c = array<vec2<f32>, 3>(vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0));',
  '  return vec4<f32>(c[i], 0.0, 1.0);',
  '}',
  '@fragment fn fs(@builtin(position) p: vec4<f32>) -> @location(0) vec4<f32> {',
  '  return textureLoad(t, vec2<i32>(p.xy), 0);',
  '}',
].join(NL);
// 翻转版：只把 V 反过来取。用来判断「差的到底是不是方向」。
const WGSL_VFLIP = [
  '@group(0) @binding(0) var t: texture_2d<f32>;',
  '@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {',
  '  var c = array<vec2<f32>, 3>(vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0));',
  '  return vec4<f32>(c[i], 0.0, 1.0);',
  '}',
  '@fragment fn fs(@builtin(position) p: vec4<f32>) -> @location(0) vec4<f32> {',
  '  let h = i32(textureDimensions(t).y);',
  '  return textureLoad(t, vec2<i32>(i32(p.x), h - 1 - i32(p.y)), 0);',
  '}',
].join(NL);

// 放到模块作用域：main() 中途抛错时，catch 也要能把已经量到的部分带出去——
// 否则一次失败只会得到一句 error，连"卡在哪一步"都不知道。
async function main() {
  const video = document.getElementById('v');
  await new Promise((res, rej) => {
    video.addEventListener('loadeddata', res, { once: true });
    video.addEventListener('error', () => rej(new Error('video error')), { once: true });
  });
  video.pause();
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const W = video.videoWidth, H = video.videoHeight;
  report.video = { w: W, h: H, readyState: video.readyState };

  step('import-pkg');
  const mod = await import('/pkg/dhampir_wasm.js');
  step('init-wasm');
  await mod.default();
  report.wasm_loaded = true;
  step('wasm-ready');

  // (1) Rust 侧：copy_external_image_to_texture + BlitRenderer + 读回 + FNV
  report.rust = JSON.parse(await mod.dhampir_preview_probe_digest('v'));

  // (2) JS 参考：同一条路再走一遍
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const errors = [];
  device.onuncapturederror = (e) => { const err = e.error; errors.push(err && err.message ? String(err.message) : String(err)); };
  const src = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SRC | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
  const dst = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  device.queue.copyExternalImageToTexture({ source: video }, { texture: src, premultipliedAlpha: false }, [W, H]);
  const shader = device.createShaderModule({ code: WGSL });
  const pipe = device.createRenderPipeline({ layout: 'auto', vertex: { module: shader, entryPoint: 'vs' }, fragment: { module: shader, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] }, primitive: { topology: 'triangle-list' } });
  const bind = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: src.createView() }] });
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: dst.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
  pass.setPipeline(pipe); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
  const readTexture = async (tex) => {
    const buf = device.createBuffer({ size: W * H * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const e = device.createCommandEncoder();
    e.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: W * 4 }, [W, H]);
    device.queue.submit([e.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    return new Uint8Array(buf.getMappedRange()).slice();
  };
  const normal = await readTexture(dst);
  const raw = await readTexture(src);
  report.js = { width: W, height: H, bytes: normal.length, digest: fnv1a64(normal) };
  report.js_raw = { width: W, height: H, bytes: raw.length, digest: fnv1a64(raw) };

  // 翻转版：判断差异是不是「方向」
  const dstFlip = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const shaderFlip = device.createShaderModule({ code: WGSL_VFLIP });
  const pipeFlip = device.createRenderPipeline({ layout: 'auto', vertex: { module: shaderFlip, entryPoint: 'vs' }, fragment: { module: shaderFlip, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] }, primitive: { topology: 'triangle-list' } });
  const bindFlip = device.createBindGroup({ layout: pipeFlip.getBindGroupLayout(0), entries: [{ binding: 0, resource: src.createView() }] });
  const enc3 = device.createCommandEncoder();
  const pass3 = enc3.beginRenderPass({ colorAttachments: [{ view: dstFlip.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
  pass3.setPipeline(pipeFlip); pass3.setBindGroup(0, bindFlip); pass3.draw(3); pass3.end();
  device.queue.submit([enc3.finish()]);
  const flipped = await readTexture(dstFlip);
  report.js_vflip = { width: W, height: H, bytes: flipped.length, digest: fnv1a64(flipped) };

  // 对照：一张「清屏色」也有摘要。不把它算出来，就会把「谁渲染成了空图」看成结论。
  const blank = new Uint8Array(W * H * 4);
  for (let i = 0; i < blank.length; i += 4) { blank[i + 3] = 255; }
  report.js_clear = { bytes: blank.length, digest: fnv1a64(blank) };
  report.is_clear = {
    rust: report.rust.digest === report.js_clear.digest,
    js_normal: report.js.digest === report.js_clear.digest,
    js_vflip: report.js_vflip.digest === report.js_clear.digest,
  };

  report.match = {
    rust_vs_js_normal: report.rust.digest === report.js.digest,
    rust_vs_js_raw: report.rust.digest === report.js_raw.digest,
    rust_vs_js_vflip: report.rust.digest === report.js_vflip.digest,
    js_raw_vs_js_normal: report.js_raw.digest === report.js.digest,
  };
  report.digests_match = report.match.rust_vs_js_normal;
  report.js_gpu_errors = errors;

  // (3) canvas 上屏链路：初始化 + 画一帧。不抛错就说明 surface/配置/present 通了。
  try {
    report.canvas_init = await mod.dhampir_preview_init('c', 'v');
    mod.dhampir_preview_draw(0);
    report.canvas_draw = 'ok';
  } catch (e) {
    report.canvas_draw = 'err: ' + (e && e.message ? e.message : String(e));
  }


  // (4) T3.2：把**自己分离出来的样本**喂给 VideoDecoder，验帧号精确
  const mp4 = new Uint8Array(await (await fetch('/media/proxy.mp4')).arrayBuffer());
  report.mp4_bytes = mp4.length;
  const meta = JSON.parse(mod.dhampir_demux_open(mp4));
  const samples = JSON.parse(mod.dhampir_demux_samples());
  report.demux = {
    width: meta.width,
    height: meta.height,
    timescale: meta.timescale,
    samples: meta.samples,
    samples_parsed: samples.length,
    sync_count: meta.sync_indices.length,
    first_sync: meta.sync_indices.slice(0, 3),
    constant_rate: meta.constant_rate,
    sync_start_of_130: mod.dhampir_demux_sync_start(130),
    frame_index_of_130: mod.dhampir_demux_frame_index(130),
  };

  const desc = mod.dhampir_demux_description();
  const codec = 'avc1.' + Array.from(desc.slice(1, 4)).map((b) => b.toString(16).padStart(2, '0')).join('');
  report.codec = codec;

  const decoded = [];
  let decodeError = null;
  const decoder = new VideoDecoder({
    output: (frame) => { decoded.push(frame); },
    error: (e) => { decodeError = String(e && e.message ? e.message : e); },
  });
  decoder.configure({ codec: codec, description: desc, codedWidth: meta.width, codedHeight: meta.height });
  // 从同步样本 0 起，喂前 6 个样本
  for (let i = 0; i < 6; i += 1) {
    const s = samples[i];
    decoder.decode(new EncodedVideoChunk({
      type: s.k ? 'key' : 'delta',
      timestamp: Math.round((s.d / meta.timescale) * 1e6),
      duration: Math.round((s.u / meta.timescale) * 1e6),
      data: mp4.subarray(s.o, s.o + s.s),
    }));
  }
  await decoder.flush();
  report.decode = { produced: decoded.length, error: decodeError };

  // 把一张 VideoFrame 走一遍「拷贝 + 搬运 + 读回」，给出摘要。
  const digestOfFrame = async (frame) => {
    const tex = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    device.queue.copyExternalImageToTexture({ source: frame }, { texture: tex, premultipliedAlpha: false }, [W, H]);
    const out = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const e = device.createCommandEncoder();
    const p = e.beginRenderPass({ colorAttachments: [{ view: out.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
    const b = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: tex.createView() }] });
    p.setPipeline(pipe); p.setBindGroup(0, b); p.draw(3); p.end();
    device.queue.submit([e.finish()]);
    const px = await readTexture(out);
    return fnv1a64(px);
  };

  if (decoded.length > 0) {
    report.decoded_frame0 = { bytes: W * H * 4, digest: await digestOfFrame(decoded[0]) };
    // 关键判据：自己分离出来的第 0 帧，渲染出来应当与 <video> 那条路的第 0 帧逐字节相同
    report.frame0_matches_video_path = report.decoded_frame0.digest === report.js.digest;
    // 按 S3.3 的约定：用完就 close，别让它活到下一轮
    decoded.forEach((f) => f.close());
  }

  // 「从同步样本起解」与「从头解」必须等价 —— 这是帧号精确那条回溯的兑现处。
  // 只留最新一帧、把上一帧立刻 close。
  // 这不是洁癖：WebCodecs 的输出帧池有限，不释放会让解码器**停下来等**，
  // flush() 就永远不 resolve——我第一次跑这一条就是这么卡住的。
  const decodeRange = async (from, to) => {
    let last = null;
    let count = 0;
    let err = null;
    const dec = new VideoDecoder({
      output: (f) => { if (last !== null) last.close(); last = f; count += 1; },
      error: (e) => { err = String(e && e.message ? e.message : e); },
    });
    dec.configure({ codec: codec, description: desc, codedWidth: meta.width, codedHeight: meta.height });
    for (let i = from; i <= to; i += 1) {
      const s = samples[i];
      dec.decode(new EncodedVideoChunk({ type: s.k ? 'key' : 'delta', timestamp: Math.round((s.d / meta.timescale) * 1e6), duration: Math.round((s.u / meta.timescale) * 1e6), data: mp4.subarray(s.o, s.o + s.s) }));
    }
    await dec.flush();
    return { last: last, count: count, err: err };
  };
  // 目标帧取 130（同步样本在 120）：不用 200 是为了别让「从头解 201 帧」把整轮拖到超时。
  const targetFrame = 130;
  const syncFrom = mod.dhampir_demux_sync_start(targetFrame);
  log('开始 seek 等价性：target=' + targetFrame + ' sync_from=' + syncFrom);
  const fromSync = await decodeRange(syncFrom, targetFrame);
  const fromStart = await decodeRange(0, targetFrame);
  report.seek = {
    target_frame: targetFrame,
    sync_from: syncFrom,
    from_sync_frames: fromSync.count,
    from_start_frames: fromStart.count,
    from_sync_error: fromSync.err,
    from_start_error: fromStart.err,
  };
  log('两条路都解完了：from_sync=' + fromSync.count + ' from_start=' + fromStart.count);
  if (fromSync.last !== null && fromStart.last !== null) {
    report.seek.from_sync_digest = await digestOfFrame(fromSync.last);
    report.seek.from_start_digest = await digestOfFrame(fromStart.last);
    report.seek.equivalent = report.seek.from_sync_digest === report.seek.from_start_digest;
    fromSync.last.close();
    fromStart.last.close();
  }


  // ---- (5) T3.4 接线 + T3.5 首次测量 ----
  const pctl = (xs) => {
    const s = [...xs].sort((a, b) => a - b);
    const at = (q) => s[Math.min(s.length - 1, Math.floor(q * s.length))];
    return { n: s.length, p50: +at(0.5).toFixed(2), p95: +at(0.95).toFixed(2), max: +s[s.length - 1].toFixed(2) };
  };

  const VRAM_BUDGET = 16 * 1024 * 1024;
  const RAM_BUDGET = 16 * 1024 * 1024;
  const frameBytes = W * H * 4;
  mod.dhampir_cache_open(VRAM_BUDGET, RAM_BUDGET);
  report.cache = {
    vram_budget: VRAM_BUDGET,
    ram_budget: RAM_BUDGET,
    frame_bytes: frameBytes,
    texture_capacity: mod.dhampir_cache_texture_capacity(W, H),
    initial: JSON.parse(mod.dhampir_cache_stats()),
  };

  const openFrames = new Map();
  let evictedTotal = 0;
  let clippedTotal = 0;
  const decodeTimes = [];
  const renderTimes = [];

  // 一次 seek：从同步样本一路解到目标帧。只留最新一帧，避免输出帧池把它卡住。
  const seekTo = async (frame) => {
    const from = mod.dhampir_demux_sync_start(frame);
    let last = null;
    const t0 = performance.now();
    const dec = new VideoDecoder({
      output: (f) => { if (last !== null) last.close(); last = f; },
      error: () => {},
    });
    dec.configure({ codec: codec, description: desc, codedWidth: meta.width, codedHeight: meta.height });
    for (let i = from; i <= frame; i += 1) {
      const s = samples[i];
      dec.decode(new EncodedVideoChunk({ type: s.k ? 'key' : 'delta', timestamp: Math.round((s.d / meta.timescale) * 1e6), duration: Math.round((s.u / meta.timescale) * 1e6), data: mp4.subarray(s.o, s.o + s.s) }));
    }
    await dec.flush();
    return { video: last, decode_ms: performance.now() - t0, sync_from: from };
  };

  const targets = [10, 50, 90, 130, 200, 260, 320, 380, 420, 460];
  for (const target of targets) {
    const got = await seekTo(target);
    if (got.video === null) continue;
    decodeTimes.push(got.decode_ms);

    // 上传 + 搬运 + 等 GPU 完成：这才是「上屏」那一步的代价（不含读回）
    const t1 = performance.now();
    const tex = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    device.queue.copyExternalImageToTexture({ source: got.video }, { texture: tex, premultipliedAlpha: false }, [W, H]);
    const out = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT });
    const e5 = device.createCommandEncoder();
    const p5 = e5.beginRenderPass({ colorAttachments: [{ view: out.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
    const b5 = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: tex.createView() }] });
    p5.setPipeline(pipe); p5.setBindGroup(0, b5); p5.draw(3); p5.end();
    device.queue.submit([e5.finish()]);
    await device.queue.onSubmittedWorkDone();
    renderTimes.push(performance.now() - t1);

    openFrames.set(target, { video: got.video, tex: tex, out: out });
    // 记账：RAM 记 VideoFrame，VRAM 记纹理；淘汰谁由 Rust 的策略说了算
    const evictRam = new Set(JSON.parse(mod.dhampir_cache_note_ram(target, frameBytes)));
    const evictVram = new Set(JSON.parse(mod.dhampir_cache_note_vram(target, frameBytes)));
    // 两层要**一起**处理再决定要不要丢掉这条记录。
    // 先前写成「先遍历 RAM 淘汰（顺带 delete），再遍历 VRAM 淘汰」——结果 VRAM 那轮
    // 在 map 里已经找不到人，一张纹理都没销毁。驱动那条「一张纹理都没淘汰」就是抓这个的。
    for (const f of new Set([...evictRam, ...evictVram])) {
      const entry = openFrames.get(f);
      if (entry === undefined) continue;
      if (evictRam.has(f)) { entry.video.close(); evictedTotal += 1; }
      if (evictVram.has(f) && entry.tex !== null) { entry.tex.destroy(); entry.tex = null; clippedTotal += 1; }
      // 两样都释放了才把记录删掉；只释放了一样就留着，免得另一种资源失去追踪。
      if (evictRam.has(f) && entry.tex === null) openFrames.delete(f);
    }
  }

  report.cache.evicted_frames = evictedTotal;
  report.cache.evicted_textures = clippedTotal;
  report.cache.open_frames_after = openFrames.size;
  report.cache.final = JSON.parse(mod.dhampir_cache_stats());
  report.perf = { targets: targets.length, decode: pctl(decodeTimes), upload_render: pctl(renderTimes) };
  log('缓存与测量完成：淘汰 ' + evictedTotal + ' 帧，decode p95=' + report.perf.decode.p95 + 'ms');

  for (const entry of openFrames.values()) { entry.video.close(); if (entry.tex !== null) entry.tex.destroy(); }
  openFrames.clear();
  log('seek 等价性：' + (report.seek.equivalent === true ? '一致' : '不一致'));
  report.ok = true;
  log('完成');
  await post(report);
}
main().catch(async (e) => {
  log('✗ ' + (e && e.stack ? e.stack : e));
  // 把已经量到的部分一并送出去：失败时最有用的信息是「走到哪一步了」。
  await post(Object.assign({ ok: false, error: String(e && e.message ? e.message : e), stack: String(e && e.stack ? e.stack : '') }, report));
});
</script>
</body>
</html>
