<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>M3 预览链路 · 实测</title>
<style>body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 12px; } video { width: 320px; } canvas { width: 320px; border: 1px solid #ccc; } #log { white-space: pre-wrap; }</style>
</head>
<body>
<h1>M3 预览链路实测：Rust 侧 FrameSource（拷贝路线）与 JS 参考逐字节比</h1>
<video id="v" src="/media/proxy.mp4" muted playsinline preload="auto"></video>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="log"></pre>
<script type="module">
const NL = String.fromCharCode(10);
const logEl = document.getElementById('log');
const log = (m) => { logEl.textContent += m + NL; };
const post = (o) => fetch('/result', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(o) });
const report = {};
const step = (name) => {
  report.step = name;
  // 进度信标：只用于"超时的时候知道卡在哪"，不参与结论。
  fetch('/progress', { method: 'POST', body: name }).catch(() => {});
};

// 与 Rust 侧同参数的 FNV-1a 64（16 位小写十六进制）——摘要能跨语言直接比。
function fnv1a64(bytes) {
  let h = 0xcbf29ce484222325n;
  const prime = 0x100000001b3n;
  const mask = (1n << 64n) - 1n;
  for (let i = 0; i < bytes.length; i += 1) { h = ((h ^ BigInt(bytes[i])) * prime) & mask; }
  return h.toString(16).padStart(16, '0');
}

// JS 参考实现：自己走一遍「拷贝 + textureLoad 搬运」，与 Rust 侧比摘要。
const WGSL = [
  '@group(0) @binding(0) var t: texture_2d<f32>;',
  '@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {',
  '  var c = array<vec2<f32>, 3>(vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0));',
  '  return vec4<f32>(c[i], 0.0, 1.0);',
  '}',
  '@fragment fn fs(@builtin(position) p: vec4<f32>) -> @location(0) vec4<f32> {',
  '  return textureLoad(t, vec2<i32>(p.xy), 0);',
  '}',
].join(NL);
// 翻转版：只把 V 反过来取。用来判断「差的到底是不是方向」。
const WGSL_VFLIP = [
  '@group(0) @binding(0) var t: texture_2d<f32>;',
  '@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {',
  '  var c = array<vec2<f32>, 3>(vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0));',
  '  return vec4<f32>(c[i], 0.0, 1.0);',
  '}',
  '@fragment fn fs(@builtin(position) p: vec4<f32>) -> @location(0) vec4<f32> {',
  '  let h = i32(textureDimensions(t).y);',
  '  return textureLoad(t, vec2<i32>(i32(p.x), h - 1 - i32(p.y)), 0);',
  '}',
].join(NL);

// 放到模块作用域：main() 中途抛错时，catch 也要能把已经量到的部分带出去——
// 否则一次失败只会得到一句 error，连"卡在哪一步"都不知道。
// mode=4k：只跑"上限 + LRU 在 4K 帧上是否生效"这一件事。
// 4K 下连解码都贵（一帧 33.2 MB），所以不做 seek 等价性、不做 200 帧播放——
// 那些是 1080p 那个模式的活。这里只看：纹理进账后会不会越界、淘汰有没有发生、堆有没有失控。
async function main4k() {
  const video = document.getElementById('v');
  step('4k-load-video');
  await new Promise((res, rej) => {
    video.addEventListener('loadeddata', res, { once: true });
    video.addEventListener('error', () => rej(new Error('video error')), { once: true });
  });
  video.pause();
  const W = video.videoWidth;
  const H = video.videoHeight;
  report.video = { w: W, h: H, readyState: video.readyState };

  step('4k-load-wasm');
  const mod = await import('/pkg/dhampir_wasm.js');
  await mod.default();
  report.wasm_loaded = true;

  step('4k-fetch');
  const mp4 = new Uint8Array(await (await fetch('/media/proxy.mp4')).arrayBuffer());
  report.mp4_bytes = mp4.length;
  const meta = JSON.parse(mod.dhampir_demux_open(mp4));
  const samples = JSON.parse(mod.dhampir_demux_samples());
  const desc = mod.dhampir_demux_description();
  const codec = 'avc1.' + Array.from(desc.slice(1, 4)).map((b) => b.toString(16).padStart(2, '0')).join('');
  report.demux = {
    width: meta.width, height: meta.height, timescale: meta.timescale,
    samples: meta.samples, samples_parsed: samples.length,
    sync_count: meta.sync_indices.length, first_sync: meta.sync_indices.slice(0, 3),
    constant_rate: meta.constant_rate,
  };
  report.codec = codec;

  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const gpuErrors = [];
  device.onuncapturederror = (e) => { const err = e.error; gpuErrors.push(err && err.message ? String(err.message) : String(err)); };

  const frameBytes = W * H * 4;
  // 4K 一帧 33.2 MB：预算给 256 MiB，换算下来约 7 张。故意给小，好让淘汰真的发生。
  const VRAM_BUDGET = 256 * 1024 * 1024;
  const RAM_BUDGET = 256 * 1024 * 1024;
  mod.dhampir_cache_open(VRAM_BUDGET, RAM_BUDGET);
  report.cache = {
    vram_budget: VRAM_BUDGET, ram_budget: RAM_BUDGET, frame_bytes: frameBytes,
    texture_capacity: mod.dhampir_cache_texture_capacity(W, H),
    initial: JSON.parse(mod.dhampir_cache_stats()),
  };

  const heapNow = () => (performance.memory ? performance.memory.usedJSHeapSize : null);
  const heapBefore = heapNow();
  let heapPeak = heapBefore;
  const texMap = new Map();
  const frames = [];
  let produced = 0;
  const span = Math.min(24, samples.length);

  // 4K 这一节**故意逐帧同步**：它要证的是「上限 + LRU 生效」，不是吞吐。
  // 前两版想在这儿也做流水线，结果是两次同类死锁——4K 的输出帧池比 1080p 更小，
  // 攒批释放的阈值猜不准。既然这条测试不关心速度，就把在飞帧压到 1 张：
  // 拷完 → 等这次提交完成 → 立刻 close。
  const dec = new VideoDecoder({
    output: async (f) => {
      produced += 1;
      const tex = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
      device.queue.copyExternalImageToTexture({ source: f }, { texture: tex, premultipliedAlpha: false }, [W, H]);
      const evT = JSON.parse(mod.dhampir_cache_note_vram(produced, frameBytes));
      for (const k of evT) { const t = texMap.get(k); if (t !== undefined) { t.destroy(); texMap.delete(k); } }
      texMap.set(produced, tex);
      const evR = JSON.parse(mod.dhampir_cache_note_ram(produced, frameBytes));
      for (const k of evR) { const idx = k - 1; if (frames[idx] !== undefined && frames[idx] !== null) { frames[idx].close(); frames[idx] = null; } }
      await device.queue.onSubmittedWorkDone();
      f.close();
      frames.push(null);
      const h = heapNow();
      if (h !== null && (heapPeak === null || h > heapPeak)) heapPeak = h;
    },
    error: () => {},
  });
  dec.configure({ codec: codec, description: desc, codedWidth: meta.width, codedHeight: meta.height });
  for (let i = 0; i < span; i += 1) {
    const s = samples[i];
    dec.decode(new EncodedVideoChunk({ type: s.k ? 'key' : 'delta', timestamp: Math.round((s.d / meta.timescale) * 1e6), duration: Math.round((s.u / meta.timescale) * 1e6), data: mp4.subarray(s.o, s.o + s.s) }));
  }
  await dec.flush();
  await device.queue.onSubmittedWorkDone();

  report.leak = { frames_alive: frames.filter((f) => f !== null).length, textures_alive: texMap.size };
  for (const f of frames) { if (f !== null) { f.close(); } }
  for (const [k, t] of texMap) { t.destroy(); mod.dhampir_cache_remove_vram(k); }
  texMap.clear();
  for (let i = 0; i < frames.length; i += 1) frames[i] = null;

  report.four_k = {
    frames_produced: produced,
    frames_requested: span,
    heap_before: heapBefore,
    heap_peak: heapPeak,
    heap_after: heapNow(),
    textures_alive_after_release: texMap.size,
    cache_final: JSON.parse(mod.dhampir_cache_stats()),
    gpu_errors: gpuErrors,
  };
  step('4k-done');
  report.ok = true;
  await post(report);
}
async function main() {
  const video = document.getElementById('v');
  await new Promise((res, rej) => {
    video.addEventListener('loadeddata', res, { once: true });
    video.addEventListener('error', () => rej(new Error('video error')), { once: true });
  });
  video.pause();
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const W = video.videoWidth, H = video.videoHeight;
  report.video = { w: W, h: H, readyState: video.readyState };

  step('import-pkg');
  const mod = await import('/pkg/dhampir_wasm.js');
  step('init-wasm');
  await mod.default();
  report.wasm_loaded = true;
  step('wasm-ready');

  // (1) Rust 侧：copy_external_image_to_texture + BlitRenderer + 读回 + FNV
  report.rust = JSON.parse(await mod.dhampir_preview_probe_digest('v'));

  // (2) JS 参考：同一条路再走一遍
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const errors = [];
  device.onuncapturederror = (e) => { const err = e.error; errors.push(err && err.message ? String(err.message) : String(err)); };
  const src = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SRC | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
  const dst = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  device.queue.copyExternalImageToTexture({ source: video }, { texture: src, premultipliedAlpha: false }, [W, H]);
  const shader = device.createShaderModule({ code: WGSL });
  const pipe = device.createRenderPipeline({ layout: 'auto', vertex: { module: shader, entryPoint: 'vs' }, fragment: { module: shader, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] }, primitive: { topology: 'triangle-list' } });
  const bind = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: src.createView() }] });
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: dst.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
  pass.setPipeline(pipe); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
  const readTexture = async (tex) => {
    const buf = device.createBuffer({ size: W * H * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const e = device.createCommandEncoder();
    e.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: W * 4 }, [W, H]);
    device.queue.submit([e.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    return new Uint8Array(buf.getMappedRange()).slice();
  };
  const normal = await readTexture(dst);
  const raw = await readTexture(src);
  report.js = { width: W, height: H, bytes: normal.length, digest: fnv1a64(normal) };
  report.js_raw = { width: W, height: H, bytes: raw.length, digest: fnv1a64(raw) };

  // 翻转版：判断差异是不是「方向」
  const dstFlip = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const shaderFlip = device.createShaderModule({ code: WGSL_VFLIP });
  const pipeFlip = device.createRenderPipeline({ layout: 'auto', vertex: { module: shaderFlip, entryPoint: 'vs' }, fragment: { module: shaderFlip, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] }, primitive: { topology: 'triangle-list' } });
  const bindFlip = device.createBindGroup({ layout: pipeFlip.getBindGroupLayout(0), entries: [{ binding: 0, resource: src.createView() }] });
  const enc3 = device.createCommandEncoder();
  const pass3 = enc3.beginRenderPass({ colorAttachments: [{ view: dstFlip.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
  pass3.setPipeline(pipeFlip); pass3.setBindGroup(0, bindFlip); pass3.draw(3); pass3.end();
  device.queue.submit([enc3.finish()]);
  const flipped = await readTexture(dstFlip);
  report.js_vflip = { width: W, height: H, bytes: flipped.length, digest: fnv1a64(flipped) };

  // 对照：一张「清屏色」也有摘要。不把它算出来，就会把「谁渲染成了空图」看成结论。
  const blank = new Uint8Array(W * H * 4);
  for (let i = 0; i < blank.length; i += 4) { blank[i + 3] = 255; }
  report.js_clear = { bytes: blank.length, digest: fnv1a64(blank) };
  report.is_clear = {
    rust: report.rust.digest === report.js_clear.digest,
    js_normal: report.js.digest === report.js_clear.digest,
    js_vflip: report.js_vflip.digest === report.js_clear.digest,
  };

  report.match = {
    rust_vs_js_normal: report.rust.digest === report.js.digest,
    rust_vs_js_raw: report.rust.digest === report.js_raw.digest,
    rust_vs_js_vflip: report.rust.digest === report.js_vflip.digest,
    js_raw_vs_js_normal: report.js_raw.digest === report.js.digest,
  };
  report.digests_match = report.match.rust_vs_js_normal;
  report.js_gpu_errors = errors;

  // (3) canvas 上屏链路：初始化 + 画一帧。不抛错就说明 surface/配置/present 通了。
  try {
    report.canvas_init = await mod.dhampir_preview_init('c', 'v');
    mod.dhampir_preview_draw(0);
    report.canvas_draw = 'ok';
  } catch (e) {
    report.canvas_draw = 'err: ' + (e && e.message ? e.message : String(e));
  }


  // (4) T3.2：把**自己分离出来的样本**喂给 VideoDecoder，验帧号精确
  const mp4 = new Uint8Array(await (await fetch('/media/proxy.mp4')).arrayBuffer());
  report.mp4_bytes = mp4.length;
  const meta = JSON.parse(mod.dhampir_demux_open(mp4));
  const samples = JSON.parse(mod.dhampir_demux_samples());
  report.demux = {
    width: meta.width,
    height: meta.height,
    timescale: meta.timescale,
    samples: meta.samples,
    samples_parsed: samples.length,
    sync_count: meta.sync_indices.length,
    first_sync: meta.sync_indices.slice(0, 3),
    constant_rate: meta.constant_rate,
    sync_start_of_130: mod.dhampir_demux_sync_start(130),
    frame_index_of_130: mod.dhampir_demux_frame_index(130),
  };

  const desc = mod.dhampir_demux_description();
  const codec = 'avc1.' + Array.from(desc.slice(1, 4)).map((b) => b.toString(16).padStart(2, '0')).join('');
  report.codec = codec;

  const decoded = [];
  let decodeError = null;
  const decoder = new VideoDecoder({
    output: (frame) => { decoded.push(frame); },
    error: (e) => { decodeError = String(e && e.message ? e.message : e); },
  });
  decoder.configure({ codec: codec, description: desc, codedWidth: meta.width, codedHeight: meta.height });
  // 从同步样本 0 起，喂前 6 个样本
  for (let i = 0; i < 6; i += 1) {
    const s = samples[i];
    decoder.decode(new EncodedVideoChunk({
      type: s.k ? 'key' : 'delta',
      timestamp: Math.round((s.d / meta.timescale) * 1e6),
      duration: Math.round((s.u / meta.timescale) * 1e6),
      data: mp4.subarray(s.o, s.o + s.s),
    }));
  }
  await decoder.flush();
  report.decode = { produced: decoded.length, error: decodeError };

  // 把一张 VideoFrame 走一遍「拷贝 + 搬运 + 读回」，给出摘要。
  const digestOfFrame = async (frame) => {
    const tex = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    device.queue.copyExternalImageToTexture({ source: frame }, { texture: tex, premultipliedAlpha: false }, [W, H]);
    const out = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const e = device.createCommandEncoder();
    const p = e.beginRenderPass({ colorAttachments: [{ view: out.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
    const b = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: tex.createView() }] });
    p.setPipeline(pipe); p.setBindGroup(0, b); p.draw(3); p.end();
    device.queue.submit([e.finish()]);
    const px = await readTexture(out);
    return fnv1a64(px);
  };

  if (decoded.length > 0) {
    report.decoded_frame0 = { bytes: W * H * 4, digest: await digestOfFrame(decoded[0]) };
    // 关键判据：自己分离出来的第 0 帧，渲染出来应当与 <video> 那条路的第 0 帧逐字节相同
    report.frame0_matches_video_path = report.decoded_frame0.digest === report.js.digest;
    // 按 S3.3 的约定：用完就 close，别让它活到下一轮
    decoded.forEach((f) => f.close());
  }

  // 「从同步样本起解」与「从头解」必须等价 —— 这是帧号精确那条回溯的兑现处。
  // 只留最新一帧、把上一帧立刻 close。
  // 这不是洁癖：WebCodecs 的输出帧池有限，不释放会让解码器**停下来等**，
  // flush() 就永远不 resolve——我第一次跑这一条就是这么卡住的。
  const decodeRange = async (from, to) => {
    let last = null;
    let count = 0;
    let err = null;
    const dec = new VideoDecoder({
      output: (f) => { if (last !== null) last.close(); last = f; count += 1; },
      error: (e) => { err = String(e && e.message ? e.message : e); },
    });
    dec.configure({ codec: codec, description: desc, codedWidth: meta.width, codedHeight: meta.height });
    for (let i = from; i <= to; i += 1) {
      const s = samples[i];
      dec.decode(new EncodedVideoChunk({ type: s.k ? 'key' : 'delta', timestamp: Math.round((s.d / meta.timescale) * 1e6), duration: Math.round((s.u / meta.timescale) * 1e6), data: mp4.subarray(s.o, s.o + s.s) }));
    }
    await dec.flush();
    return { last: last, count: count, err: err };
  };
  // 目标帧取 130（同步样本在 120）：不用 200 是为了别让「从头解 201 帧」把整轮拖到超时。
  const targetFrame = 130;
  const syncFrom = mod.dhampir_demux_sync_start(targetFrame);
  log('开始 seek 等价性：target=' + targetFrame + ' sync_from=' + syncFrom);
  const fromSync = await decodeRange(syncFrom, targetFrame);
  const fromStart = await decodeRange(0, targetFrame);
  report.seek = {
    target_frame: targetFrame,
    sync_from: syncFrom,
    from_sync_frames: fromSync.count,
    from_start_frames: fromStart.count,
    from_sync_error: fromSync.err,
    from_start_error: fromStart.err,
  };
  log('两条路都解完了：from_sync=' + fromSync.count + ' from_start=' + fromStart.count);
  if (fromSync.last !== null && fromStart.last !== null) {
    report.seek.from_sync_digest = await digestOfFrame(fromSync.last);
    report.seek.from_start_digest = await digestOfFrame(fromStart.last);
    report.seek.equivalent = report.seek.from_sync_digest === report.seek.from_start_digest;
    fromSync.last.close();
    fromStart.last.close();
  }


  // ---- (5) T3.4 接线 + T3.5 首次测量 ----
  const pctl = (xs) => {
    const s = [...xs].sort((a, b) => a - b);
    const at = (q) => s[Math.min(s.length - 1, Math.floor(q * s.length))];
    return { n: s.length, p50: +at(0.5).toFixed(2), p95: +at(0.95).toFixed(2), max: +s[s.length - 1].toFixed(2) };
  };

  const VRAM_BUDGET = 16 * 1024 * 1024;
  const RAM_BUDGET = 16 * 1024 * 1024;
  const frameBytes = W * H * 4;
  mod.dhampir_cache_open(VRAM_BUDGET, RAM_BUDGET);
  report.cache = {
    vram_budget: VRAM_BUDGET,
    ram_budget: RAM_BUDGET,
    frame_bytes: frameBytes,
    texture_capacity: mod.dhampir_cache_texture_capacity(W, H),
    initial: JSON.parse(mod.dhampir_cache_stats()),
  };

  const openFrames = new Map();
  let evictedTotal = 0;
  const decodeTimes = [];
  const renderTimes = [];

  // **复用一个解码器**：真实实现不会每拖一次就新建一个。
  // 先前 seekTo 里每帧 seek 都 new + configure 一次，那笔固定开销被算进了 seek 延迟——
  // 这也解释了为什么有头（硬件解码）与无头几乎一样（60.8 vs 60.3 ms）：贵的不是解码。
  // 复用是安全的：每次都从同步样本喂起，喂一个新关键帧就等于重置了参考链。
  let seekLast = null;
  const seekDec = new VideoDecoder({
    output: (f) => { if (seekLast !== null) seekLast.close(); seekLast = f; },
    error: () => {},
  });
  seekDec.configure({ codec: codec, description: desc, codedWidth: meta.width, codedHeight: meta.height });

  // 一次 seek：从同步样本一路解到目标帧。只留最新一帧，避免输出帧池把它卡住。
  const seekTo = async (frame) => {
    const from = mod.dhampir_demux_sync_start(frame);
    seekLast = null;
    const t0 = performance.now();
    const dec = seekDec;
    for (let i = from; i <= frame; i += 1) {
      const s = samples[i];
      dec.decode(new EncodedVideoChunk({ type: s.k ? 'key' : 'delta', timestamp: Math.round((s.d / meta.timescale) * 1e6), duration: Math.round((s.u / meta.timescale) * 1e6), data: mp4.subarray(s.o, s.o + s.s) }));
    }
    await dec.flush();
    return { video: seekLast, decode_ms: performance.now() - t0, sync_from: from };
  };

  step('section5-start');
  // 8 个抽样点：要给出像样的 p95，样本太少没有意义。
  // （上一版 10 个在 1080p 上把整轮拖过 7 分钟，5 个又太少——8 是个折中。）
  const targets = [10, 60, 130, 200, 280, 340, 400, 460];
  // **纹理池**：真实实现不会每拖一次就新分配一张 8.29 MB 纹理。
  // 先前 tex / out 都在计时窗口里 new，那笔分配被算进了 scrub 延迟——
  // 这是继「每 seek 新建解码器」之后排掉的第二个同类假象。
  const POOL = 3;
  const texPool = [];
  for (let i = 0; i < POOL; i += 1) {
    texPool.push(device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING }));
  }
  const outTex = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT });
  const outView = outTex.createView();
  // 池**不入缓存账**：这本账是给「逐帧缓存」用的，而池是 harness 的固定开销。
  // 先前把它按 frameBytes*(POOL+1) 记了进去，而预算只够 2 张 —— 于是 vram_over 变 true，
  // 驱动那条闸当场报红。闸是对的：我不该把固定资源混进逐帧账里。
  let poolIdx = 0;
  const seekTimes = [];
  // 两个口径一起量：
  //   seek_submit = 到「提交完」为止 —— 用户拖动时实际要等的那一下（画面随即交给合成器）；
  //   seek_synced = 再等到「GPU 完成」—— 上界，因为真实预览不会为每一帧付这个整往返。
  // 只报一个都会失真：只报前者会偏乐观，只报后者会把量法本身的等待算成渲染开销。
  const seekSubmitTimes = [];
  for (const target of targets) {
    // 这一次计时覆盖**整条 scrub 路径**：从同步样本解码到目标帧 → 上传 → 搬运 → 提交 → 等 GPU 完成。
    // 这才是用户拖动时真正等的那一下；先前把 decode 与 upload 分成两段各自同步，
    // 多算了一次同步，而且给不出一个可定档的单一数字。
    const tSeek = performance.now();
    const got = await seekTo(target);
    if (got.video === null) continue;
    decodeTimes.push(got.decode_ms);

    // 上传 + 搬运 + 等 GPU 完成：这才是「上屏」那一步的代价（不含读回）
    const t1 = performance.now();
    const tex = texPool[poolIdx % POOL];
    poolIdx += 1;
    device.queue.copyExternalImageToTexture({ source: got.video }, { texture: tex, premultipliedAlpha: false }, [W, H]);
    const e5 = device.createCommandEncoder();
    const p5 = e5.beginRenderPass({ colorAttachments: [{ view: outView, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
    const b5 = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: tex.createView() }] });
    p5.setPipeline(pipe); p5.setBindGroup(0, b5); p5.draw(3); p5.end();
    device.queue.submit([e5.finish()]);
    seekSubmitTimes.push(performance.now() - tSeek);
    await device.queue.onSubmittedWorkDone();
    renderTimes.push(performance.now() - t1);
    seekTimes.push(performance.now() - tSeek);

    // 帧仍然逐张入 RAM 账（VideoFrame 是真的会积累的那种资源）；
    // 纹理已由固定池承担，不再逐帧记账，也就没有「淘汰哪张纹理」这回事了。
    openFrames.set(target, { video: got.video });
    const evictRam = new Set(JSON.parse(mod.dhampir_cache_note_ram(target, frameBytes)));
    for (const f of evictRam) {
      const entry = openFrames.get(f);
      if (entry === undefined) continue;
      entry.video.close();
      openFrames.delete(f);
      evictedTotal += 1;
    }
  }

  report.cache.evicted_frames = evictedTotal;
  report.cache.open_frames_after = openFrames.size;
  report.cache.final = JSON.parse(mod.dhampir_cache_stats());
  report.perf = {
    targets: targets.length,
    seek_submit: pctl(seekSubmitTimes),
    seek_synced: pctl(seekTimes),
    decode: pctl(decodeTimes),
    upload_render: pctl(renderTimes),
  };
  log('缓存与测量完成：淘汰 ' + evictedTotal + ' 帧，seek(提交) p95=' + report.perf.seek_submit.p95 + 'ms，seek(同步) p95=' + report.perf.seek_synced.p95 + 'ms');

  for (const entry of openFrames.values()) entry.video.close();
  openFrames.clear();
  for (const t of texPool) t.destroy();
  outTex.destroy();

  // ---- (6) T3.5：流水线播放（不再每帧全同步）+ 内存曲线 ----
  step('section6-start');
  const playFrom = 60;
  // 2 秒 @60fps 足够量吞吐；240 帧在 1080p 下太贵。
  const playCount = 120;
  const playTextures = new Map();
  let pendingClose = [];
  let produced = 0;
  let playEvictedTex = 0;
  const heapNow = () => (performance.memory ? performance.memory.usedJSHeapSize : null);
  const heapBefore = heapNow();
  let heapPeak = heapBefore;
  mod.dhampir_cache_open(VRAM_BUDGET, RAM_BUDGET);

  const playDec = new VideoDecoder({
    output: async (f) => {
      produced += 1;
      // 拷 + 搬 + 提交，**不等 GPU**——这正是流水线与上一节的区别
      const tex = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
      device.queue.copyExternalImageToTexture({ source: f }, { texture: tex, premultipliedAlpha: false }, [W, H]);
      const out = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT });
      const e6 = device.createCommandEncoder();
      const p6 = e6.beginRenderPass({ colorAttachments: [{ view: out.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
      const b6 = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: tex.createView() }] });
      p6.setPipeline(pipe); p6.setBindGroup(0, b6); p6.draw(3); p6.end();
      device.queue.submit([e6.finish()]);

      // 纹理进 VRAM 账：超过预算就把该淘汰的销毁掉
      const evicted = JSON.parse(mod.dhampir_cache_note_vram(produced, frameBytes));
      for (const k of evicted) { const t = playTextures.get(k); if (t !== undefined) { t.destroy(); playTextures.delete(k); playEvictedTex += 1; } }
      playTextures.set(produced, tex);

      // 每 4 帧同步一次、把已提交的源帧关掉。**这个 4 是被卡死教出来的**：
      // 上一版等攒够 16 帧才释放，而 1080p 下解码器的输出帧池比 16 小——
      // 于是它等我们释放、我们等攒够 16，双方对等 = 死锁（整轮卡在 section6 十几分钟）。
      // 批量越小越安全，代价只是多几次 onSubmittedWorkDone。
      pendingClose.push(f);
      if (pendingClose.length >= 4) {
        await device.queue.onSubmittedWorkDone();
        for (const x of pendingClose) x.close();
        pendingClose = [];
        const h = heapNow();
        if (h !== null && (heapPeak === null || h > heapPeak)) heapPeak = h;
      }
    },
    error: () => {},
  });
  playDec.configure({ codec: codec, description: desc, codedWidth: meta.width, codedHeight: meta.height });

  const tPlay = performance.now();
  for (let i = playFrom; i < playFrom + playCount; i += 1) {
    const s = samples[i];
    playDec.decode(new EncodedVideoChunk({ type: s.k ? 'key' : 'delta', timestamp: Math.round((s.d / meta.timescale) * 1e6), duration: Math.round((s.u / meta.timescale) * 1e6), data: mp4.subarray(s.o, s.o + s.s) }));
  }
  await playDec.flush();
  await device.queue.onSubmittedWorkDone();
  for (const x of pendingClose) x.close();
  pendingClose = [];
  const playMs = performance.now() - tPlay;
  const heapAfter = heapNow();
  const fps = produced / (playMs / 1000);
  // 先释放、再记账：`vram_textures_alive` 要等于「漏没漏」，不是「释放前有几张」。
  // 上一版写成释放前取值，驱动那条「播放结束后还留着 2 张纹理没释放」当场就报了——
  // 那条闸是对的，错的是这个字段的位置。
  for (const [k, t] of playTextures) {
    t.destroy();
    // 释放要**回报**给缓存账，否则账目比现实多留几张（这本账是用来防漏的，不能自己漏）。
    mod.dhampir_cache_remove_vram(k);
  }
  playTextures.clear();
  // 纹理淘汰的证据由这一节提供（第 5 节改用固定池之后不再逐帧淘汰纹理）。
  report.cache.evicted_textures = playEvictedTex;
  report.playback = {
    frames: produced,
    requested: playCount,
    wall_ms: +playMs.toFixed(1),
    ideal_ms_at_60fps: +((playCount / 60) * 1000).toFixed(1),
    fps: +fps.toFixed(1),
    drop_ratio: +Math.max(0, 1 - fps / 60).toFixed(3),
    heap_before: heapBefore,
    heap_peak: heapPeak,
    heap_after: heapAfter,
    vram_textures_alive: playTextures.size,
    cache_final: JSON.parse(mod.dhampir_cache_stats()),
  };
  log('播放：' + report.playback.fps + ' fps 丢帧率 ' + report.playback.drop_ratio);
  log('seek 等价性：' + (report.seek.equivalent === true ? '一致' : '不一致'));

  // ---- (7) T4.3：按**工程**渲染，而不是按视频文件 ----
  step('section7-start');
  const single = {
    schema: 1,
    timebase: { num: 30, den: 1 },
    tracks: [{
      id: 'v1',
      kind: 'video',
      clips: [{
        id: 'c1',
        source: 'proxy.mp4',
        source_in: 0,
        track_at: 0,
        duration: 60,
        transform: { x: 0, y: 0, scale: 1, rotation_deg: 0 },
        opacity: 1,
        effects: [],
        keyframes: [],
      }],
    }],
  };
  const opened = JSON.parse(mod.dhampir_project_open(JSON.stringify(single)));
  report.project = {
    parsed: opened.parsed,
    ok: opened.ok,
    issues: Array.isArray(opened.issues) ? opened.issues.length : -1,
    first_frame: mod.dhampir_project_first_frame(),
    end_frame: mod.dhampir_project_end_frame(),
  };
  const layersAt0 = JSON.parse(mod.dhampir_project_frame(0));
  report.project_frame0 = {
    frame: layersAt0.frame,
    layers: layersAt0.layers.length,
    first_opacity: layersAt0.layers.length > 0 ? layersAt0.layers[0].opacity : null,
    first_source_frame: layersAt0.layers.length > 0 ? layersAt0.layers[0].source_frame : null,
  };

  // 关键判据：**退化工程走时间线这条路，必须与 M3 的单片段路径逐字节相同。**
  // 这条证明「把预览换成按工程渲染」没有把原来对的东西弄坏。
  const probe = JSON.parse(await mod.dhampir_project_render_probe('v', 0, W, H));
  report.project_probe = probe;
  report.project_matches_m3 = probe.digest === report.rust.digest;
  log('工程路径：' + probe.digest + ' / M3 路径：' + report.rust.digest);

  // 再验一个**带转场**的工程：结构上该是两层，下面那层是冻帧。
  // 这条不需要 GPU —— 它验的是「求值层真的被宿主接上了」，而不是只接了单片段那条。
  const withTransition = JSON.parse(JSON.stringify(single));
  withTransition.tracks[0].clips.push({
    id: 'c2',
    source: 'proxy.mp4',
    source_in: 0,
    track_at: 60,
    duration: 30,
    transform: { x: 0, y: 0, scale: 1, rotation_deg: 0 },
    opacity: 1,
    effects: [],
    keyframes: [],
    transition_in: { kind: 'cross_dissolve', duration: 10 },
  });
  const opened2 = JSON.parse(mod.dhampir_project_open(JSON.stringify(withTransition)));
  const midTransition = JSON.parse(mod.dhampir_project_frame(65));
  report.project_transition = {
    ok: opened2.ok,
    layers: midTransition.layers.length,
    any_frozen: midTransition.layers.some((l) => l.frozen_for_transition === true),
    opacities: midTransition.layers.map((l) => l.opacity),
  };
  step('posting');
  report.ok = true;
  log('完成');
  await post(report);
}
// mode=sample：只渲样本工程并交 PNG 给驱动 —— 给双端比对用。
// 刻意跑得短：这条要能反复跑（每轮比对都要重来），不该拖上七分钟。
async function mainSample() {
  step('sample-load-wasm');
  const mod = await import('/pkg/dhampir_wasm.js');
  await mod.default();
  report.wasm_loaded = true;

  step('sample-fetch-project');
  const json = await (await fetch('/sample-project.json')).text();
  const opened = JSON.parse(mod.dhampir_project_open(json));
  const frames = [0, 15, 30, 45, 75];
  report.sample = { ok: opened.ok === true, issues: Array.isArray(opened.issues) ? opened.issues.length : -1, rendered: [] };
  if (opened.ok !== true) {
    report.ok = false;
    await post(report);
    return;
  }

  const W = 320;
  const H = 180;
  for (const frame of frames) {
    step('sample-render-' + frame);
    // 不传 video：这个入口用的是 core 生成的合成源，两端输入逐字节相同。
    const png = await mod.dhampir_sample_project_render_png(json, frame, W, H);
    const bytes = png instanceof Uint8Array ? png : new Uint8Array(png);
    await fetch('/sample-png?frame=' + frame, { method: 'POST', body: bytes });
    report.sample.rendered.push({ frame: frame, bytes: bytes.length });
  }

  step('sample-posting');
  report.ok = true;
  await post(report);
}
const mode = new URLSearchParams(location.search).get('mode');
const entry = mode === '4k' ? main4k : mode === 'sample' ? mainSample : main;
entry().catch(async (e) => {
  log('✗ ' + (e && e.stack ? e.stack : e));
  // 把已经量到的部分一并送出去：失败时最有用的信息是「走到哪一步了」。
  await post(Object.assign({ ok: false, error: String(e && e.message ? e.message : e), stack: String(e && e.stack ? e.stack : '') }, report));
});
</script>
