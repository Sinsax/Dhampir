# HTML 宿主（DOM / CSS）与引擎之间**允许的差异**台账。
#
# # 为什么不能混进 framediff-thresholds.toml
#
# 那一份比的是**引擎 vs 引擎**（浏览器 WebGPU 那条腿 vs native 那条腿）——
# 同一段 WGSL、两套编译器与驱动，差异的性质是**舍入**，所以它能按实测最差值定档。
# 这一份比的是**引擎 vs 浏览器自己的渲染**（CSS 合成器）：两者根本不是同一个渲染器，
# 差异的性质是**算法不同**。混在一起会让那一份的推导（"允许比实测再差一倍"）失去意义。
#
# # 一条铁规矩
#
# **没量过的数不许写成数。** 没量过就写 status = "未实测"，把量法写进 method；
# 把"待定"写成一个看起来像门槛的数字，是这份仓库最反对的那种假数。
# 判据：scripts/check-dom-differences.mjs（status 与"有没有数"必须自洽）。
#
# # status 三档
#
#   "未实测"   —— 知道会有差异、还没量（**必须**带 method，且**不许**带数字）
#   "已实测"   —— 量过（**必须**带数字，并在 note 里写清哪一轮、什么机器）
#   "明确接受" —— 不打算量，明说接受（带理由）
#
# # 每条都要被引用
#
# 判据会检查每个 section 名在**别处**（docs/ 或 web/capabilities.json）出现过 ——
# 免得这份台账变成一份没人读的清单（那种清单迟早烂掉）。

[geometry.edge_antialias]
status = "已实测"
edge_max_diff_max = 112
method = """
**已有一键量法**（第 83 轮）：node scripts/measure-dom-parity.mjs
它自己起链路：同一份工程 → 引擎出 PNG（dhampir frame）→ headless Chrome 把同一个层画在**同一尺寸**上
（CDP 截视口，视口尺寸就是渲染尺寸）→ 逐像素比。
量的是**边缘那一圈**（既不是纯填充也不是纯底色的像素，再向外扩 2 圈），不是整帧均值 ——
整帧均值会把这圈差异稀释成看起来没事，而肉眼恰恰在边缘上。
覆盖范围：圆角（`geometry.corner-radius`）与裁剪形状（`geometry.clip-path` 的三种）——它们都是「每像素一个覆盖度」。
"""
note = "**第 83 轮量到了**（headless Chrome 155 / Windows / RTX 4070；引擎 = dhampir 0.4.0 release 构建；工程与截图都在 target/dom-parity/geometry.edge_antialias/）：一个 200×120 的圆角矩形转 30°，边缘环 **2200 个像素里 399 个不同**，**最大通道差 112**（在 (147,13)）、平均 7.33。斜坡宽度（半透明类像素 ÷ 形状周长）**引擎 0.406 像素、浏览器 0.809 像素** —— 浏览器那一侧的斜坡大约是引擎的两倍宽，这就是 112 那一下的来源：同一条边上两边各在斜坡的不同位置。CSS 用自己的覆盖度算法（不同厂商还不一样）。形状两边一致（圆角矩形、圆、椭圆、内缩矩形都一致），差在边缘那一圈。**第 16 轮起裁剪形状也走这条**。**原先这里写着「1 目标像素宽」——那是论断，第 52 轮实测把它推翻了（引擎侧更窄），第 81 轮又把浏览器那一侧也量了（它比引擎宽一倍）。** 量法的诚实前提：DOM 宿主画的是**占位方块**（它不解码素材），量测页把那块方块涂成与引擎同色同尺寸 —— 量的是**浏览器对同一几何的处理**，不是"宿主默认外观像不像引擎"。"

[blend.add_plus_lighter]
status = "已实测"
max_abs_diff_max = 95
method = """
**已有一键量法**（第 83 轮）：node scripts/measure-dom-parity.mjs --case blend.add_plus_lighter
同一帧、引擎 vs DOM；加法混合在亮部最容易分叉（预乘与夹取的口径不同），取**上层方块内**的最大通道差。
上面那层的不透明度设成 **0.5** —— 那是两者分叉的地方（αs = 1 时两边本来就相同）。
"""
note = "**第 53 轮把「未必逐值相同」换成了精确关系**（两边的定义都写下来才算关系）：本仓 `add` 的颜色分量是 `src·1 + dst·1` —— **rgb 不看源 alpha**；CSS `plus-lighter` 是 `αs·Cs + Cb`（预乘后相加）。⇒ **相同当且仅当 αs = 1**；αs < 1 时本仓多加了 `(1−αs)·Cs`，而且 alpha 的走法也不同（本仓 `αs + αb·(1−αs)`，CSS `min(1, αs + αb)`）。引擎那一侧已由 GPU 判据钉住（opacity 1.0 与 0.5 **rgb 一字不变**）。**第 83 轮把 DOM 那一侧也量了**（headless Chrome 155 / RTX 4070；工程在 target/dom-parity/blend.add_plus_lighter/）：上层不透明度 0.5 时，**中心像素引擎 [255,120,255]、浏览器 [230,90,160]** —— 与上面两条手算**逐值吻合**；上层方块里 **25600 / 25600 个像素全部不同**，最大通道差 **95**。所以"未必逐值相同"现在是**量出来的**，不是推出来的：这两个函数在同一份输入上处处不同，差多少由这一条定档。"

# ---- 掩码那一条原本塞了三种**性质完全不同**的差异（第 54 轮拆开）----
#
# 拆的理由：一条 `未实测` 会让"**刻意的、已经判过的**差异"看起来像"还没量"——
# 而前者根本不该等实测（它就是设计），后者才需要浏览器。混在一起，读的人分不出来。

# ---- 掩码：原本三种差异塞在一条里（第 54 轮拆开）----
#
# 拆的理由：一条 `未实测` 会把「**刻意的、已经判过的**差异」伪装成「还没量」——
# 前者根本不该等实测（它就是设计），后者才需要浏览器。混在一起读的人分不出来。

[mask.availability]
status = "明确接受"
note = "工程里掩码 uri 是相对文件名时，DOM 宿主**刻意不设** mask-image —— 取不到遮罩时浏览器会把**整个元素遮没**，那比画不出遮罩更坏。引擎侧照常按素材遮罩（两边因此不同：一个是没遮、一个是被遮）。**理由不是量不了，而是宁可没有遮罩也不要遮没。** 判据：scripts/check-dom-css.mjs 的 checkMaskCases（取不到的 uri 必须 css 为空、且 refused 里要出现「遮没」这个词；素材不在表里同样不设并报出）。**注意这里说的是 DOM 宿主**（`web/dom-host.mjs`，HTML/CSS 那条腿）；**wasm 预览宿主是另一套**：它走 `dhampir_project_set_mask_image`，由 `engine.uploadMasks()` 把掩码位图取来交给它（第 72/73 轮接上）"

[mask.invert_dom]
status = "明确接受"
note = "**反相**在 CSS 的 `mask-image` 里表达不了（要靠 mask-composite 换图）—— DOM 这一版**没有把反相画上去**，引擎侧画了。这是能力缺口而不是量测问题：要补就得换一张反相的图（或改用 mask-composite）。判据：scripts/check-dom-css.mjs 的 checkMaskCases（带 invert 时必须报出来，素材掩码与渐变掩码两种都查）"

[mask.interpolation_kernel]
status = "已实测"
max_abs_diff_max = 1
method = """
**已有一键量法**（第 83 轮）：node scripts/measure-dom-parity.mjs --case mask.interpolation_kernel
那一页把掩码素材写成能直接取到的 http URL（DOM 侧取不到就刻意不设，见 mask.availability），
两边都按"拉伸填满"画。
同一份工程、同一个帧号：引擎出 PNG，浏览器把 DOM 宿主画在同一尺寸上，用 dhampir-framediff 比。
**只比能取到素材的那种**（http / blob / data）—— 取不到的没有可比的 DOM 侧（见 mask.availability）。
量的是**掩码内部的插值**：把掩码图缩放到非整数倍，让纹素边界落在像素中心之间，再比两边在同一圈的取值。
引擎侧是**自己写的双线性**，CSS 那边是各实现自己的滤波。
"""
note = "两边都滤波，但**核不同**。引擎侧已实测（第 55/56 轮）：把 2×2 掩码铺到 32×32，在**纹素中心那一行**读到的剖面是 `255×8` 后接**恒定增量 −16** 的线性斜坡 —— 即"自己写的双线性"，且**边缘没有被压暗**（第一个纹素精确 255）。**第 83 轮把 DOM 那一侧也量了**（headless Chrome 155 / RTX 4070）：同一张 3×3 掩码拉伸到 200×120，第 100 列的剖面 —— 引擎 `255,255,253,228,203,177,152,126,101,75,50,24,0,0`、浏览器 `255,255,254,228,202,177,152,126,101,75,49,24,0,0`，**最大差 1/255**。核不同（引擎是自写的双线性），但在这条构型上结果几乎逐值相同 —— 比预期小得多，所以这一条的容差就是 **1**。注意两边**都**要先"拉伸填满"才是同一个问题（第 81 轮顺带给 DOM 侧补上了 `mask-size: 100% 100%` + `mask-repeat: no-repeat`：CSS 默认的 `auto`+`repeat` 会**平铺**，那两天说的不是同一件事）"
[lottie.vector]
status = "明确接受"
note = "Lottie / Rive 那一档**不做**：引擎没有矢量渲染器。这不是容差问题 —— 能力登记表里它标在 needs-primitive / other"
