# dhampir-framediff 的阈值档 —— **跨机/跨厂商**那一腿的档位。
#
# 用法：
#   node scripts/dhampir-framediff.mjs --a <帧目录> --b <帧目录> \
#     --label-a <甲> --label-b <乙> --out <输出目录> --thresholds scripts/framediff-thresholds.toml
# （`--thresholds` 不传就用这个文件。`verdict.json` 里会记下这个文件的 FNV-1a 摘要，
#   读记录的人能确认"当时用的就是这一份档"；**改了这份文件，摘要就变**，改完必须重跑记录。）
#
# 同机同栈那一腿不要用这份：它另有一份更严的（framediff-thresholds-exact.toml，判逐字节相等）。
# 这份管的问题是"换了厂商之后还像不像同一张图"。
#
# ============================================================================
# 数值来源：T2.6 真跑实测，不是拍脑袋（plan §5 T2.4 要求"必须按实测定档"）
# ============================================================================
#
# 实测用的是这一对运行时（就是真实部署形态：用户设备一家、服务端另一家）：
#   甲 = records/m2/browser-amd/frames   浏览器 WebGPU / AMD Radeon(TM) Graphics
#                                       驱动 32.0.21030.2001，Chrome 153 无头（--force_low_power_gpu）
#                                       帧集摘要 bc09803eb44beac8
#   乙 = records/m1/dx12/frames         native DX12 / NVIDIA GeForce RTX 4070，驱动 32.0.16.1074
#                                       帧集摘要 4bc004b502a1301a
#   命令 node scripts/dhampir-framediff.mjs --a records/m2/browser-amd/frames \
#          --b records/m1/dx12/frames --label-a browser-webgpu-amd --label-b native-dx12-nvidia \
#          --out records/m2/framediff-crossvendor --thresholds scripts/framediff-thresholds.toml
#   判据 records/m2/framediff-crossvendor/verdict.json（5 场景 80 帧，exit_code 0）
#
# 量出来的东西（逐场景，min SSIM 取最差帧）：
#   场景           mean SSIM             min SSIM              min PSNR      max|Δ|  差异像素/帧
#   alpha_stack    0.9999911822267717    0.9999892068517506    49.89 dB      1       65536（全图）
#   blur           0.9999999782648813    0.999999978264881     92.62 dB      1       3
#   checker        1                     1                     inf           0       0（逐字节相同）
#   gradient       0.9997868247257939    0.9997810177884726    65.52 dB      1       3584（14 条整高窄带）
#   srgb_linear    1                     1                     inf           0       0（逐字节相同）
#
#   口径提醒（同一个词、两个数）：上面这列是**单帧**的差异像素数；`summary.csv` 也是逐帧。
#   而 `verdict.json` / `report.txt` 里那个 `diff_pixels` 是**逐场景 16 帧的合计**
#   （gradient 每帧 3584 → 记录里写 57344）。对账时先统一口径，别当成两份数打架。
#   括号里的形状同样按单帧读，而且"条数"与"是哪几条"要**分开说**：
#   `gradient` 每帧都恰好 14 条整高窄带（16 帧逐帧都是 14——这一栏确实是逐帧不变的），
#   但**是哪 14 列逐帧在变**：16 帧给出 16 个不同的列集合，跨 16 帧的并集是 128 列
#   （= 16 × 8；每个 16 列一档里，并集恰好是 {3,4,5,7,8,10,11,12} 这 8 个偏移）。
#   14、16、128 三个数都对，问的不是同一件事；三个数都出自
#   `records/m2/framediff-crossvendor/shape.json`（`--shape` 的产物，可对着本档重算）。
#   （这句话原来写成"逐帧不变"，把"条数"与"是哪几条"混成了一句——口径含糊对下一位
#     就是歧义，所以这里改成分开说。本档改一个字节摘要就变，对应记录已按下面那条规则重跑。）
#   `alpha_stack` 每帧整幅 65536 个像素全差 1（256 列全部整高、256 行全部整宽），
#   `blur` 每帧 3 个散点（16 帧逐帧都不成带：整高列 0 条，bbox 是 rows 39..41 × cols 39..44 的一小块）。
#
# ============================================================================
# 三条档位怎么来的
# ============================================================================
#
# `max_abs_diff_max = 1` —— 这条不是"实测恰好是 1 就写 1"，那只是巧合级的理由。真正的理由有两层：
#   ① 规范层面：8 位 sRGB 编码允许硬件近似，规范给的余量就是 **1 LSB**。仓里已有同一个数的先例
#      （`render/scene.rs` 的 `BYTE_TOLERANCE = 1`，管"实测 vs 模型预测"），理由同源；
#   ② 分辨力层面：它必须能拦住结构性差异。真数据负对照（`target/m2-framediff-negative.mjs`，
#      把 checker 场景整体错开一帧）量到 **max|Δ| = 174**——1 与 174 之间没有灰度地带，
#      这条路障的意思是"任何一处差到 2 就不是舍入了"。把档位放到 2 或 3，等于替真缺陷留出藏身处。
#
# `mean_ssim_min` / `min_ssim_min = 0.9995` —— 用一条写明的规则算出来的，不是挑出来的数：
#   **允许比这次实测再差一倍**，即 档位 = 1 − 2 × (1 − 实测最差值)，再向下取到 4 位小数。
#     mean：1 − 2 × (1 − 0.9997868247257939) = 0.9995736494515878 → 0.9995
#     min ：1 − 2 × (1 − 0.9997810177884726) = 0.9995620355769452 → 0.9995
#   两条各管一件事：`min` 是"最差的那一帧不许比实测再差一倍"，`mean` 是"整批的平均不许
#   被少数坏帧拖过去"（只有 min 的话，一帧烂、十五帧好 与 十六帧都烂 读起来一样）。
#   为什么不用 plan 原文的起点值（0.995 / 0.98）：那是"还没量过时的建议"，而实测最差是 0.99978——
#   用一个离现实 0.019 的闸去量，闸等于没有；记录里那句"达标"会变成一句好听话。
#   为什么不再往上贴（比如 0.9999）：这份档要管的是**还没见过的那些卡**，实测值只代表这一对；
#   贴着实测写，下一块卡（Intel Arc、Apple M 系）有一点点不同的舍入就会误报，
#   而误报的结局历来是有人把闸改松——那比一开始就留一倍余量更糟。
#
# `[scenario.*]` 里那两条 `max_abs_diff_max = 0` —— 它们不是"更严"，它们是**对照**：
#   `checker`（像素级棋盘）与 `srgb_linear`（8 条平色竖条）在 AMD/NVIDIA 这一对上**逐字节相同**。
#   这两个场景的算术里没有插值、没有混合（差异的两个已知来源都不涉及），所以"要求相等"在这里
#   不是苛刻，而是让它们去分开两种局面的工具：
#     它们红了 → 差异已经不是"多操作数算术的舍入"（那是可以容的），而是色彩转换/量化一类的
#                东西（那必须查）；它们绿了 → 那 ±1 的来处被夹在"插值/混合"这个范围内。
#   换句话说：这两条是**诊断用的**，不是拿来"更难通过"的。
#
#   它们为什么"应该相等"：这两个场景的输出颜色**都是常量**——checker 每格一个固定色、
#   奇偶由整数运算定；srgb_linear 每条带一个固定色、边界落在精确的 1/8 上。两者的算术里
#   既没有随像素变化的插值结果，也没有混合，所以跨厂商差异的两个已知来源都碰不到它们。
#
#   红了怎么办（写给下一位）：**先查，别先改这份文件**。顺序是
#     ① 先看是不是色彩转换/量化那一类（例如某块卡把纯平色的 8 位 sRGB 编码就差在 1 LSB 上）；
#     ② 查清来源后，若它确实是"能说清来历的 1 LSB"，就按上面**同一条规则**重新定档，
#        把新的实测与来源一起写进这份文件；
#     ③ 来源说不清，就当缺陷处理——这两条存在的意义就是分清这两种局面。
#   唯一不许的做法：把 `max_abs_diff_max = 0` 删掉或放宽成 1，只为让某次记录变绿。
#   改了这份文件的任何一个字节，摘要就变，对应记录必须重跑（摘要绑在记录里，不是形式）。
#
# ============================================================================
# 故意留白的一栏
# ============================================================================
#
# `psnr_db_min` 不设。实测最差是 49.89 dB（alpha_stack），它比另外两条多能抓的只有
# "全图每个像素、每个通道都差 1"这一类（那大约是 48.13 dB）——而那正是这份档**明说接受**的容差
# （≤ 1 LSB）。写一个专门去抓"我刚刚声明接受的东西"的闸，只会让下一个人看不懂这份档在说什么。
# 真出了结构性差异，`max_abs_diff` 先拦下（174 vs 1），轮不到 PSNR 说话。
#
# ============================================================================
# 按场景分档怎么写（机制已实现且自检覆盖）
# ============================================================================
#   [scenario.blur]
#   min_ssim_min = 0.999   # 只覆盖写了的键，没写的沿用 [default]
# 规矩：
#   · `[default]` 是打底档，`mean_ssim_min` 与 `min_ssim_min` **必须**能解析出来——
#     解析不出来的场景不许混进"全过"（工具会直接报错，不是当没设闸）。
#   · 不认识的键 / 不认识的节 / 同一个键写两遍 —— 一律报错。
#     拼错的键若被静默忽略，这道闸就等于没设。

[default]
mean_ssim_min = 0.9995
min_ssim_min = 0.9995
max_abs_diff_max = 1

# 对照：无插值、无混合的平色/硬边场景，实测跨厂商逐字节相同（见上面"对照"那段）
[scenario.checker]
max_abs_diff_max = 0

[scenario.srgb_linear]
max_abs_diff_max = 0
