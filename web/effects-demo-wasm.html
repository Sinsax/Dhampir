  #report { white-space:pre-wrap; font-family:ui-monospace,monospace; font-size:12px; max-width:560px; }

<script type="module">
import { loadEngine } from './engine.js';
window.__step = 'boot';
window.__err = null;
const mark = (name) => { window.__step = name; console.log('[demo] ' + name); };
window.addEventListener('unhandledrejection', (event) => {
  window.__err = 'unhandledrejection: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason));
  const el = document.getElementById('status'); if (el) { el.className = 'bad'; el.textContent = window.__err; }
});
window.addEventListener('error', (event) => {
  window.__err = 'error: ' + event.message;
  const el = document.getElementById('status'); if (el) { el.className = 'bad'; el.textContent = window.__err; }
});
mark('module-start');
const doc = JSON.parse(document.getElementById('doc').textContent);
const PREFIX = 'effects-demo/';
const assetUri = new Map();
for (const asset of doc.assets || []) assetUri.set(asset.id, PREFIX + asset.uri);
const statusEl = document.getElementById('status');
const report = document.getElementById('report');
const frameEl = document.getElementById('frame');
const fnum = document.getElementById('fnum');
mark('loadEngine:begin');
const engine = await loadEngine('/pkg/dhampir_wasm.js');
mark('loadEngine:done');
mark('open:begin');
const opened = engine.open(JSON.stringify(doc));
mark('open:done ok=' + opened.ok);
if (opened.ok !== true) { statusEl.className = 'bad'; statusEl.textContent = '工程没通过：' + JSON.stringify(opened.issues || opened); }
// 顺序照真实应用：open -> attach（attach 会按画布尺寸做 resize；
// 在 attach 之前调 resize 会撞上「宿主尚未初始化」—— 实测就这么死的）。
mark('attach:begin');
await engine.attach('preview');
mark('attach:done mode=' + engine.sourceMode);
// 本工程的素材是**图片**（不是视频）⇒ 必须显式切到位图模式；
// 否则宿主会去找 <video>（找不到）⇒ 画布一直空着。
engine.setSourceMode('bitmap');
mark('setSourceMode:done');

// 掩码必须在 attach 之后交（否则宿主还没初始化 —— 实测就是这么死的）。
// **声明必须在用它的代码之前**：上一版把掩码块挪到了这行之前 ⇒
// "Cannot access 'bitmaps' before initialization"，页面直接死在第一次绘制前。
const bitmaps = new Map();
let maskIds = new Set();
for (const track of doc.timeline.tracks) for (const layer of track.layers) {
  const mask = layer.mask;
  if (mask && typeof mask.asset_id === 'string' && mask.asset_id !== '') maskIds.add(mask.asset_id);
}
const maskBitmaps = {};
for (const id of maskIds) { const b = await bitmapFor(id); if (b !== null) maskBitmaps[id] = b; }
mark('masks:begin');
const uploaded = await engine.uploadMasks(maskBitmaps);
mark('masks:done n=' + uploaded.length);
async function bitmapFor(assetId) {
  if (bitmaps.has(assetId)) return bitmaps.get(assetId);
  const uri = assetUri.get(assetId);
  if (uri === undefined) return null;
  const img = new Image();
  img.src = uri;
  await img.decode();
  const bitmap = await createImageBitmap(img);
  bitmaps.set(assetId, bitmap);
  return bitmap;
}
window.__drawn = 0;
mark('draw:defined');
window.__err = null;
async function draw() {
  const frame = Number(frameEl.value);
  fnum.textContent = String(frame);
  try {
    // **静态源必须走 `onPrepared` 这个缝隙**（引擎自己留的）：`prepare` 的第一件事是
    // `clear_bitmaps()`，所以 seek 之前/之后随意交都会被下一次 prepare 清掉 —— 引擎注释里
    // 记着这个实测现象：「交与不交，画面逐字节相同」。缝隙正好在「清完了、还没 draw」之间。
    mark('seek:begin ' + frame);
    await engine.seek(frame, {
      onPrepared: async (f) => {
        for (const entry of engine.sourcesFor(f)) {
          const bitmap = await bitmapFor(entry.source);
          if (bitmap !== null) engine.setSourceBitmap(entry.source, bitmap);
        }
      },
    });
    window.__drawn += 1;
    mark('seek:done ' + frame);
    statusEl.className = 'ok';
    statusEl.textContent = 'wasm 已上屏 · 掩码 ' + uploaded.length + '/' + maskIds.size;
  } catch (error) {
    statusEl.className = 'bad';
    window.__err = String(error && error.message ? error.message : error);
    statusEl.textContent = '这一帧失败：' + window.__err;
    throw error;
  }
}
let playing = false, cur = 0;
async function loop() {
  while (playing) {
    cur = cur >= 860 ? 0 : cur + 1;
    frameEl.value = String(cur);
    fnum.textContent = String(cur);
    try { await draw(); } catch (error) { playing = false; break; }
    await new Promise((r) => setTimeout(r, 20));
  }
}
document.getElementById('play').addEventListener('click', (e) => {
  playing = !playing;
  e.target.classList.toggle('on', playing);
  e.target.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  if (playing) { cur = Number(frameEl.value); loop(); }
});
document.getElementById('stop').addEventListener('click', () => { playing = false; document.getElementById('play').textContent = '▶ 播放'; cur = 0; frameEl.value = '0'; draw(); });
frameEl.addEventListener('input', () => { playing = false; document.getElementById('play').textContent = '▶ 播放'; draw(); });
await draw();
</script>
