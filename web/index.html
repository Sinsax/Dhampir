<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dhampir · 预览与出片</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%239A6BC4'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Arial' font-weight='bold' fill='%23fff' text-anchor='middle'%3Ed%3C/text%3E%3C/svg%3E">
<!-- 样式在 web/app.css。**放在文件里而不是内联**：内联样式表会随 index.html 一起
     被"整页替换"式的改动波及，而它的改动频率远低于结构。 -->
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="layout">

  <!-- 顶栏：这一屏唯一会真的产出东西的按钮（导出）放最右。 -->
  <header id="topbar">
    <span class="brand">dhampir</span>
    <span class="rule"></span>
    <!-- 工程身份由 app.js 填（工程 id / 轨道数 / 序列尺寸）。**放在顶栏**是因为
         "我现在在剪哪一份工程、多大尺寸"是判断"画面为什么是这样"的第一个前提。 -->
    <span class="identity" id="projectId">正在载入…</span>
    <span class="spacer"></span>
    <span class="chip n" id="fpsLabel"></span>
    <!-- 丢帧统计。播放跟不上时**必须说出来**：画面在跳是看得见的，
         跳了几帧、是解码不行还是刚切过标签页，看不见。 -->
    <span class="chip n" id="playStats"></span>
    <!-- 这一条按钮是**核心承诺的兑现口**：预览与出片必须给出可比的帧。
         点一下就把后端渲染的那一帧取回来，并报出两边的像素差 —— 对了要看得见，
         不对也要看得见。 -->
    <button class="mini-btn" id="realFrameBtn" title="用出片那条路渲染当前帧，与预览比对">真实出片帧</button>
    <button class="mini-btn" id="shortcutBtn" title="快捷键（?）">快捷键</button>
    <button class="mini-btn primary" id="export">导出视频</button>
  </header>

  <section id="stage">
    <!-- 舞台是中性的深底：浅底会把暗部看错，而预览的职责就是让人判断画面。 -->
    <div class="stage-frame">
      <canvas id="preview" width="640" height="360"></canvas>
      <!-- **真实出片帧**：后端拿同一份工程渲染的同一帧（走 dhampir frame 那条路）。
           它盖在画布上而不是另开一个窗口 —— 要比的是"同一帧的两次渲染"，
           并排放两个盒子会让人先比较布局、再比较画面。 -->
      <img id="realFrame" hidden alt="后端渲染的真实出片帧">
      <span class="stage-tag" id="stageTag" hidden></span>
    </div>

    <div id="transport">
      <button class="icon-btn" id="first" title="回到首帧（Home）"></button>
      <button class="icon-btn" id="prev" title="上一帧（← / ,）"></button>
      <!-- 播放是**帧号驱动**的：素材元素是被 seek 出来的一帧，让它自己播就等于预览
           有了第二个时钟，与出片那条路迟早分叉（那正是本工程最忌讳的事）。 -->
      <button class="icon-btn" id="play" title="播放 / 暂停（空格 / K）"></button>
      <button class="icon-btn" id="next" title="下一帧（→ / .）"></button>
      <button class="icon-btn" id="last" title="到末帧（End）"></button>
      <!-- 时码：帧号是**契约单位**，时间读数是给人看的。两个都给，别让人换算。 -->
      <span class="timecode" id="frameLabel">帧 <b id="frameNow">0</b> <span class="tc-sub" id="frameTime">00:00.00</span></span>
      <input id="frame" type="range" min="0" max="89" value="0" aria-label="播放头">
      <span class="spacer"></span>
      <!-- 音频只有播放/定位/音量三样：用户明确说了音频不要特效。 -->
      <button class="icon-btn" id="muteBtn" title="静音 / 取消静音（M）"></button>
      <input id="volume" type="range" min="0" max="100" value="80" aria-label="音量"
             title="音量（只有播放时才有声音）">
    </div>
  </section>

  <section id="timeline-panel">
    <div class="panel-head">
      <span class="panel-title">时间线</span>
      <span class="hint">拖动片段改位置 · 拖左右缘改时长 · 点击选中</span>
    </div>
    <div id="trackArea">
      <div id="markers"></div>
      <div id="timeline"></div>
    </div>
  </section>

  <!-- 出片进度。进度未知时显示不确定态，**不用 0 冒充**。 -->
  <div id="progress" hidden>
    <div id="progressTrack"><div id="progressBar"></div></div>
    <span id="progressText"></span>
    <a class="mini-btn" id="download" hidden>下载成片</a>
  </div>

  <div id="issues"></div>

  <aside id="inspector">
    <h3>素材库</h3>
    <!-- 引用次数由 Rust 算（dhampir library），这里只负责画出来 ——
         在前端重数一遍就是第二份实现，而两份实现一定会漂。 -->
    <div id="library" class="lib"></div>
    <h3>编辑</h3>
    <div id="editBar">
      <button class="mini-btn" id="undoBtn" title="撤销（Ctrl+Z）">撤销</button>
      <button class="mini-btn" id="redoBtn" title="重做（Ctrl+Shift+Z）">重做</button>
      <button class="mini-btn" id="splitBtn" title="在播放头处切开选中片段（S）">剃刀</button>
      <button class="mini-btn danger" id="removeBtn" title="删除选中片段（Delete）">删除</button>
      <button class="mini-btn danger" id="rippleBtn" title="删除并把后面的片段左移补位">波纹删除</button>
      <label>序列帧率<input id="seqFps" type="number" min="1" value="30"></label>
      <button class="mini-btn" id="applyFps">应用帧率</button>
    </div>
    <h3>元素属性</h3>
    <div id="props" class="pane"></div>
  </aside>
</div>

<!-- 素材与音轨的宿主。**藏起来**：画面一律走 canvas，声音只从 <audio> 出。 -->
<div id="videos"></div>
<div id="audios"></div>
<!-- 导出范围。app.js 把 first..end-1 写进 data-*；hidden 是因为 v1 不做范围选择 UI。 -->
<div id="frameOnly" hidden data-from="0" data-to="0"></div>
<div id="toasts"></div>

<div id="shortcuts" hidden>
  <div class="sheet">
    <h3>快捷键</h3>
    <table>
      <tr><td class="k">空格 / K</td><td class="d">播放 · 暂停</td></tr>
      <tr><td class="k">← / ,</td><td class="d">上一帧</td></tr>
      <tr><td class="k">→ / .</td><td class="d">下一帧</td></tr>
      <tr><td class="k">Shift + ← / →</td><td class="d">前后 1 秒</td></tr>
      <tr><td class="k">Home / End</td><td class="d">首帧 · 末帧</td></tr>
      <tr><td class="k">J / L</td><td class="d">上一帧 · 下一帧（剪辑台习惯）</td></tr>
      <tr><td class="k">M</td><td class="d">静音开关</td></tr>
      <tr><td class="k">S</td><td class="d">在播放头剃刀</td></tr>
      <tr><td class="k">Delete</td><td class="d">删除选中片段</td></tr>
      <tr><td class="k">Ctrl + Z</td><td class="d">撤销</td></tr>
      <tr><td class="k">Ctrl + Shift + Z</td><td class="d">重做</td></tr>
      <tr><td class="k">?</td><td class="d">打开 · 关闭这张表</td></tr>
    </table>
    <p class="hint" style="margin-top:10px">输入框里打字时快捷键一律让位。</p>
  </div>
</div>

<script>
// **页面里的错要发得出去。**
// 没有这段，页面里抛的错在外面只能表现为「什么都没发生」——
// 而那种状态无法诊断，只能靠猜。用 sendBeacon 是因为它在页面正在卸载时也能发。
function dhampirReport(text) {
  try { navigator.sendBeacon("/page-error", String(text).slice(0, 2000)); } catch (e) {}
}
window.addEventListener("error", function (event) {
  dhampirReport(event.message + " @ " + event.filename + ":" + event.lineno + ":" + event.colno);
});
window.addEventListener("unhandledrejection", function (event) {
  dhampirReport("unhandledrejection: " + (event.reason && event.reason.message ? event.reason.message : String(event.reason)));
});
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
