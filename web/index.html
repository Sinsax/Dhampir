<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dhampir 剪辑</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #17181c; color: #e6e6e6; }
  #layout {
    display: grid; grid-template-columns: 1fr 320px;
    grid-template-rows: auto auto 1fr auto auto; gap: 10px; padding: 10px; height: 100vh;
  }
  #preview { grid-column: 1; grid-row: 1; background: #000; border: 1px solid #2c2e36; border-radius: 6px; width: 100%; max-height: 42vh; object-fit: contain; }
  #inspector { grid-column: 2; grid-row: 1 / span 5; background: #1d1f25; border: 1px solid #2c2e36; border-radius: 6px; padding: 10px; overflow: auto; }
  #transport { grid-column: 1; grid-row: 2; display: flex; align-items: center; gap: 8px; }
  #trackArea { grid-column: 1; grid-row: 3; overflow: auto; background: #1d1f25; border: 1px solid #2c2e36; border-radius: 6px; padding: 8px; }
  #markers { position: relative; height: 12px; margin-bottom: 4px; border-bottom: 1px solid #2c2e36; }
  #progress { grid-column: 1; grid-row: 4; display: flex; align-items: center; gap: 10px; }
  #issues { grid-column: 1 / span 2; grid-row: 5; min-height: 32px; font-size: 12px; overflow: auto; max-height: 110px; }
  #progressTrack { flex: 1; height: 8px; background: #24262d; border-radius: 4px; overflow: hidden; }
  #progressBar { height: 100%; width: 0; background: #4f6da3; transition: width .2s linear; }
  #progressBar.indeterminate { width: 100%; background: repeating-linear-gradient(45deg, #37507a 0 10px, #2f4a75 10px 20px); }
  .track { position: relative; height: 30px; margin: 5px 0; background: #24262d; border-radius: 4px; }
  .track-label { position: absolute; left: 4px; top: 7px; font-size: 11px; color: #8b90a0; pointer-events: none; z-index: 2; }
  .layer { position: absolute; top: 4px; height: 22px; background: #37507a; border: 1px solid #4f6da3; border-radius: 3px; font-size: 11px; padding: 2px 5px; overflow: hidden; white-space: nowrap; cursor: pointer; }
  .layer.selected { background: #7a5a2c; border-color: #c99b48; }
  .layer.adjustment { background: #4a3a6a; border-color: #7d63a8; }
  .layer.disabled { opacity: .45; }
  .layer .tr { position: absolute; left: 0; top: 0; bottom: 0; background: #d09a3c; opacity: .6; }
  .marker { position: absolute; top: 0; width: 2px; height: 10px; background: #d09a3c; }
  input[type=number] { width: 96px; background: #12131a; color: #e6e6e6; border: 1px solid #34374a; border-radius: 3px; padding: 2px 4px; }
  select { width: 96px; background: #12131a; color: #e6e6e6; border: 1px solid #34374a; border-radius: 3px; padding: 2px 4px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 5px 0; }
  h3 { margin: 4px 0 8px; font-size: 12px; color: #9aa0b0; text-transform: uppercase; letter-spacing: .06em; }
  button { background: #2f4a75; color: #e6e6e6; border: 1px solid #4f6da3; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  a#download { background: #2f6b3a; border: 1px solid #4a9a5a; border-radius: 4px; padding: 5px 10px; color: #e6e6e6; text-decoration: none; }
  .identity { font-size: 11px; color: #9aa0b0; margin-bottom: 8px; word-break: break-all; }
  .lib { font-size: 11px; max-height: 120px; overflow: auto; }
  .lib .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 0; border-bottom: 1px solid #24262d; }
  .lib .row button { padding: 1px 6px; font-size: 11px; }
  .lib .unused { color: #e8c46a; }
  #editBar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #editBar button { padding: 3px 7px; font-size: 11px; }
  #editBar label { font-size: 11px; gap: 4px; margin: 0; }
  .hint { color: #c9c9c9; }
  .bad { color: #ff8f8f; }
  .warn { color: #e8c46a; }
  .ok { color: #8fd18f; }
  video { display: none; }
</style>
</head>
<body>
<div id="layout">
  <canvas id="preview" width="640" height="360"></canvas>
  <div id="transport">
    <button id="first">|&lt;</button>
    <button id="prev">−1</button>
    <input id="frame" type="range" min="0" max="89" value="0" style="flex:1">
    <button id="next">+1</button>
    <button id="last">&gt;|</button>
    <span id="frameLabel">0</span>
    <button id="export">导出视频</button>
  </div>
  <div id="trackArea">
    <div id="markers"></div>
    <div id="timeline"></div>
  </div>
  <!-- 出片进度。进度未知时显示不确定态，**不用 0 冒充**。 -->
  <div id="progress" hidden>
    <div id="progressTrack"><div id="progressBar"></div></div>
    <span id="progressText"></span>
    <a id="download" hidden>下载成片</a>
  </div>
  <aside id="inspector">
    <h3>素材库</h3>
    <!-- 引用次数由 Rust 算（dhampir library），这里只负责画出来 ——
         在前端重数一遍就是第二份实现，而两份实现一定会漂。 -->
    <div id="library" class="lib">（未连接后端）</div>
    <h3>编辑</h3>
    <div id="editBar">
      <button id="splitBtn">剃刀（播放头）</button>
      <button id="removeBtn">删除</button>
      <button id="rippleBtn">波纹删除</button>
      <label>序列帧率<input id="seqFps" type="number" min="1" value="30"></label>
      <button id="applyFps">应用帧率</button>
    </div>
    <h3>元素属性</h3>
    <div id="props">（未选中元素）</div>
  </aside>
  <div id="issues"></div>
  <!-- 导出范围。app.js 把 first..end-1 写进 data-*；hidden 是因为 v1 不做范围选择 UI。 -->
  <div id="frameOnly" hidden data-from="0" data-to="0"></div>
</div>
<div id="videos"></div>
<script>
// **页面里的错要发得出去。**
// 没有这段，页面里抛的错在外面只能表现为「什么都没发生」——
// 而那种状态无法诊断，只能靠猜。用 sendBeacon 是因为它在页面正在卸载时也能发。
function dhampirReport(text) {
  try { navigator.sendBeacon("/page-error", String(text).slice(0, 2000)); } catch (e) {}
}
window.addEventListener("error", function (event) {
  dhampirReport(event.message + " @ " + event.filename + ":" + event.lineno + ":" + event.colno);
});
window.addEventListener("unhandledrejection", function (event) {
  dhampirReport("unhandledrejection: " + (event.reason && event.reason.message ? event.reason.message : String(event.reason)));
});
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
